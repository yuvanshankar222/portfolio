name: Bug Report
description: Report a bug
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: bug
    attributes:
      label: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
